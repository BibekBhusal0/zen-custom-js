name: Update and Build Resources

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Record start commit
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Update theme.json files
        id: update_theme
        run: |
          bun run update-theme
          echo "updated=$?" >> $GITHUB_OUTPUT

      - name: Commit theme.json changes
        if: steps.update_theme.outputs.updated == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add **/theme.json
          git diff --cached --quiet || git commit -m "chore: Update theme.json"

      - name: Build BrowseBot
        run: bun run build:browsebot

      - name: Commit BrowseBot changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dist/*.uc.mjs
          git diff --cached --quiet || git commit -m "chore: Update browsebot build"

      - name: Combine Preferences
        run: bun run combine-preferences

      - name: Commit preferences changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add preferences.json
          git diff --cached --quiet || git commit -m "chore: Update combined preferences"

      - name: Run Prettier
        run: bun run format

      - name: Commit formatting changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --cached --quiet || git commit -m "chore: Auto format"

      - name: Fetch latest changes
        run: git fetch origin ${{ github.ref_name || 'main' }}

      - name: Push all changes
        run: git push origin ${{ github.ref_name || 'main' }}

      - name: Workflow summary
        if: always()
        run: |
          START="${{ steps.start.outputs.sha }}"
          {
            echo "## Update and Build Summary"
            echo ""
            echo "### Commits in this run"
            echo ""
            LOG=$(git log --pretty=format:'- %s (%h)' "$START"..HEAD -- 2>/dev/null)
            if [ -z "$LOG" ]; then
              echo "_No new commits._"
            else
              echo "$LOG"
            fi
            echo ""
            echo ""
            echo "### Files changed in this run"
            echo ""
            echo '```'
            STAT=$(git diff --stat "$START"..HEAD -- . 2>/dev/null)
            if [ -z "$STAT" ]; then
              echo "No changes."
            else
              echo "$STAT"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
